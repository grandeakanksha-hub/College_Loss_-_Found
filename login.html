<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Campus Lost & Found</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body>


<div class="container">

    <div class="row justify-content-center align-items-center" style="min-height:100vh;">

        <div class="col-md-5 col-lg-4">

            <div class="card shadow-lg p-4">


                <!-- Logo -->

                <div class="text-center mb-4">

                    <div
                        class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center mx-auto mb-3"
                        style="width:70px;height:70px;"
                    >

                        <i class="bi bi-search-heart-fill fs-2"></i>

                    </div>

                    <h2 class="fw-bold text-primary mb-1">
                        Campus Lost & Found
                    </h2>

                    <p class="text-muted">
                        Welcome back! Please login to continue.
                    </p>

                </div>


                <!-- Error Message -->

                {% if msg %}

                <div class="alert alert-danger d-flex align-items-center">

                    <i class="bi bi-exclamation-circle-fill me-2"></i>

                    <span>{{ msg }}</span>

                </div>

                {% endif %}


                <!-- Login Form -->

                <form method="POST">


                    <div class="mb-3">

                        <label class="form-label fw-semibold">
                            Email Address
                        </label>

                        <div class="input-group">

                            <span class="input-group-text bg-white">
                                <i class="bi bi-envelope text-primary"></i>
                            </span>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                placeholder="Enter your email"
                                required
                            >

                        </div>

                    </div>


                    <div class="mb-4">

                        <label class="form-label fw-semibold">
                            Password
                        </label>

                        <div class="input-group">

                            <span class="input-group-text bg-white">
                                <i class="bi bi-lock text-primary"></i>
                            </span>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                placeholder="Enter your password"
                                required
                            >

                        </div>

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary w-100 py-2"
                    >

                        <i class="bi bi-box-arrow-in-right me-2"></i>

                        Login

                    </button>


                </form>


                <div class="text-center mt-4">

                    <span class="text-muted">
                        Don't have an account?
                    </span>

                    <a
                        href="/register"
                        class="text-primary fw-semibold text-decoration-none"
                    >
                        Create Account
                    </a>

                </div>


            </div>


            <p class="text-center text-muted small mt-3">

                © 2026 Campus Lost & Found System

            </p>


        </div>

    </div>

</div>


</body>

</html>
